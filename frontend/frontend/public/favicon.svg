<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vGradient" x1="90" y1="80" x2="420" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.38" stop-color="#4F46E5"/>
      <stop offset="0.68" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="150" y1="360" x2="370" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- V-shaped play mark -->
  <path
    d="M92 105
       C103 91 126 92 138 108
       L220 238
       L287 126
       C296 111 318 108 331 119
       C343 129 345 147 336 162
       L246 315
       C239 327 227 334 214 334
       C200 334 188 327 181 316
       L92 144
       C85 131 85 116 92 105Z"
    fill="url(#vGradient)"
    filter="url(#glow)"
  />

  <!-- Inner play triangle -->
  <path
    d="M219 174
       C224 166 236 166 243 173
       L278 208
       C286 216 280 230 269 230
       H215
       C203 230 197 216 205 208
       L219 174Z"
    fill="white"
    opacity="0.95"
  />

  <!-- VYBE wordmark -->
  <text
    x="256"
    y="404"
    text-anchor="middle"
    fill="url(#textGradient)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="68"
    font-weight="800"
    letter-spacing="2"
  >VYBE</text>

  <!-- Tagline -->
  <text
    x="256"
    y="443"
    text-anchor="middle"
    fill="#CBD5E1"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="500"
    letter-spacing="5"
  >WATCH • SHARE • CONNECT</text>
</svg>
